services:
  vgg_histo_redis:
    container_name: vgg_histo_redis
    image: redis
    networks:
      vgg_histo_network:
        aliases:
          - vgg_histo_redis
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 3s
      retries: 10
      start_period: 5s

  vgg_histo_backend:
    container_name: vgg_histo_backend
    image: vgg_histo_backend:latest
    build:
      context: .
      dockerfile: docker/backend/Dockerfile
    ports:
      - 7030:8000
    volumes:
      - ./src:/app
      - ${IEDL_ROOT_DIR}:/iedl_root_dir
      - ${IIIF_CACHE_HOST_ROOT}:/iiif_cache
    depends_on:
      - vgg_histo_redis
    env_file:
      - .env
    environment:
      DEPLOY: prod
      PYTHONUNBUFFERED: 1
      NVIDIA_VISIBLE_DEVICES: all
      NVIDIA_DRIVER_CAPABILITIES: compute,utility
    networks:
      - vgg_histo_network
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]

  vgg_histo_celery_worker:
    container_name: vgg_histo_celery_worker
    image: vgg_histo_celery_worker:latest
    build:
      context: .
      dockerfile: docker/worker/Dockerfile
    # --pool=solo: prefork + CUDA is unsafe; solo runs tasks in one process
    command: celery -A celery_tasks.process_folder worker --loglevel=info --pool=solo
    env_file:
      - .env
    environment:
      DEPLOY: prod
      NVIDIA_VISIBLE_DEVICES: all
      NVIDIA_DRIVER_CAPABILITIES: compute,utility
    volumes:
      - ./src:/app
      - ${IEDL_ROOT_DIR}:/iedl_root_dir
      - ${IIIF_CACHE_HOST_ROOT}:/iiif_cache
    depends_on:
      vgg_histo_redis:
        condition: service_healthy
      vgg_histo_backend:
        condition: service_started
    networks:
      - vgg_histo_network
    deploy:
      resources:
        limits:
          memory: 16G
        reservations:
          memory: 8G
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]

  vgg_histo_db:
    container_name: vgg_histo_db
    image: postgres:17
    ports:
      - 5432:5432
    environment:
      POSTGRES_DB: ${PG_DB}
      POSTGRES_USER: ${PG_USER}
      POSTGRES_PASSWORD: ${PG_PASSWORD}
    volumes:
      - db_data:/var/lib/postgresql/data
    networks:
      - vgg_histo_network

networks:
  vgg_histo_network:
    name: vgg_histo_network
    driver: bridge

volumes:
  db_data:

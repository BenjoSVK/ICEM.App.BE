services:
  vgg_histo_redis:
    container_name: vgg_histo_redis
    image: redis
    networks:
      - vgg_histo_network

  vgg_histo_backend:
    container_name: vgg_histo_backend
    image: vgg_histo_backend:latest
    build:
      context: .
      dockerfile: docker/backend/Dockerfile
  vgg_histo_backend:
    container_name: vgg_histo_backend
    image: vgg_histo_backend:latest
    build: .
    ports:
      - 7030:8000
    volumes:
      - ./src:/app
      - ${IEDL_ROOT_DIR:-./iedl_root_dir}:/iedl_root_dir
    depends_on:
      - vgg_histo_redis
    env_file:
      - .env
    environment:
      DEPLOY: prod
      PYTHONUNBUFFERED: 1
      NVIDIA_VISIBLE_DEVICES: all
      NVIDIA_DRIVER_CAPABILITIES: compute,utility
    networks:
      - vgg_histo_network
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
      - /mnt/persist/xptacek/iedl_root_dir:/iedl_root_dir
    env_file:
      - .env
    networks:
      - vgg_histo_network

  vgg_histo_celery_worker:
    container_name: vgg_histo_celery_worker
    image: vgg_histo_celery_worker:latest
    build:
      context: .
      dockerfile: docker/worker/Dockerfile
    command: celery -A celery_tasks.process_folder worker --loglevel=info --concurrency=1
    env_file:
      - .env
    environment:
      DEPLOY: prod
      NVIDIA_VISIBLE_DEVICES: all
      NVIDIA_DRIVER_CAPABILITIES: compute,utility
    volumes:
      - ./src:/app
      - ${IEDL_ROOT_DIR:-./iedl_root_dir}:/iedl_root_dir
    depends_on:
      - vgg_histo_backend
      - vgg_histo_redis
    networks:
      - vgg_histo_network
    deploy:
      resources:
        limits:
          memory: 16G
        reservations:
          memory: 8G
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]

  vgg_histo_db:
    container_name: vgg_histo_db
    image: postgres:17
    ports:
      - 5432:5432
    environment:
      POSTGRES_DB: ${PG_DB}
      POSTGRES_USER: ${PG_USER}
      POSTGRES_PASSWORD: ${PG_PASSWORD}
    volumes:
      - db_data:/var/lib/postgresql/data
    build: .
    command: celery -A celery_tasks.process_folder worker --loglevel=info --concurrency=1
    env_file:
      - .env
    volumes:
      - ./src:/app
      - /mnt/persist/xptacek/iedl_root_dir:/iedl_root_dir
    depends_on:
      - vgg_histo_backend
    networks:
      - vgg_histo_network

networks:
  vgg_histo_network:
    external: true

volumes:
  db_data:
    external: true

services:
  vgg_histo_redis:
    container_name: vgg_histo_redis
    image: redis
    networks:
      - vgg_histo_network

  vgg_histo_backend:
    container_name: vgg_histo_backend
    image: icemappbe-vgg_histo_backend
    build:
      context: .
      dockerfile: docker/backend/Dockerfile
    ports:
      - 7030:8000
    volumes:
      - ./src:/app
      - ./iedl_root_dir:/iedl_root_dir
    depends_on:
      - vgg_histo_redis
    env_file:
      - .env
    environment:
      DEPLOY: dev
      PYTHONUNBUFFERED: 1
      NVIDIA_VISIBLE_DEVICES: all
      NVIDIA_DRIVER_CAPABILITIES: compute,utility
    networks:
      - vgg_histo_network
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]

  vgg_histo_celery_worker:
    container_name: vgg_histo_celery_worker
    image: icemappbe-vgg_histo_celery_worker
    build:
      context: .
      dockerfile: docker/worker/Dockerfile
    command: celery -A celery_tasks.process_folder worker --loglevel=info --concurrency=1
    env_file:
      - .env
    environment:
      DEPLOY: dev
      NVIDIA_VISIBLE_DEVICES: all
      NVIDIA_DRIVER_CAPABILITIES: compute,utility
       NVIDIA_VISIBLE_DEVICES: all
       NVIDIA_DRIVER_CAPABILITIES: compute,utility
    volumes:
      - ./src:/app
      - ./iedl_root_dir:/iedl_root_dir
    depends_on:
      - vgg_histo_redis
      - vgg_histo_backend
    networks:
      - vgg_histo_network
    deploy:
      resources:
        limits:
          memory: 48G
        reservations:
          memory: 16G
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]

  vgg_histo_db:
    container_name: vgg_histo_db
    image: postgres:17
    ports:
      - 5432:5432
    environment:
      POSTGRES_DB: ${PG_DB}
      POSTGRES_USER: ${PG_USER}
      POSTGRES_PASSWORD: ${PG_PASSWORD}
      POSTGRES_DB: mydatabase
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: mysecretpassword
    volumes:
      - db_data:/var/lib/postgresql/data
    networks:
      - vgg_histo_network

networks:
  vgg_histo_network:
    external: true

volumes:
  db_data:
